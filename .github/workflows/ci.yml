name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: type errors and lint problems never reach main. No DB needed.
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: i18n key parity
        run: npm run check:i18n

  # Migrate + seed a real Postgres, run unit tests, then production build.
  test-build:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://study:study@localhost:5432/study_crm
      SUPABASE_ENABLED: 'false'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: study_crm
          POSTGRES_USER: study
          POSTGRES_PASSWORD: study
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Migrate + seed database
        run: npm run db:migrate -- --seed
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  # E2E: Playwright against a production build with a real Postgres.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://study:study@localhost:5432/study_crm
      SUPABASE_ENABLED: 'false'
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: study_crm
          POSTGRES_USER: study
          POSTGRES_PASSWORD: study
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Migrate + seed database
        run: npm run db:migrate -- --seed
      - name: Production build
        run: npm run build
      - name: E2E tests
        run: npm run test:e2e
